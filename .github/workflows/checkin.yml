name: AgentRouter 自动签到
# Auto check-in workflow
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: windows-2025
    environment: production
    permissions:
      contents: read
      issues: write
    env:
      PYTHONIOENCODING: utf-8
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 缓存 UV 依赖
      uses: actions/cache@v4
      id: uv-cache
      with:
        path: |
          ~/.cache/uv
          .venv
        key: ${{ runner.os }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 安装依赖
      if: steps.uv-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装项目依赖..."
        uv sync
        echo "✅ 环境初始化完成"

    - name: 获取 Playwright 版本
      id: playwright-version
      run: |
        $version = uv run python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Playwright version: $version"

    - name: 缓存 Playwright 浏览器
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~\AppData\Local\ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: 安装 Playwright 浏览器
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        echo "缓存未命中，开始安装 Playwright 浏览器..."
        uv run playwright install chromium --with-deps

    - name: 恢复余额历史缓存
      uses: actions/cache@v4
      with:
        path: balance_hash.txt
        key: balance-hash-${{ github.sha }}
        restore-keys: |
          balance-hash-

    - name: 执行签到
      shell: pwsh
      env:
        PIN_ACCOUNTS: ${{ secrets.PIN_ACCOUNTS }}
        DINGDING_WEBHOOK: ${{ secrets.DINGDING_WEBHOOK }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        EMAIL_TO: ${{ secrets.EMAIL_TO }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        SERVERPUSHKEY: ${{ secrets.SERVERPUSHKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        WEIXIN_WEBHOOK: ${{ secrets.WEIXIN_WEBHOOK }}
      run: |
        $output = uv run checkin.py 2>&1 | Out-String
        $code = $LASTEXITCODE
        Write-Output $output
        $output | Out-File -FilePath checkin_output.txt -Encoding utf8
        if ($code -ne 0) {
          Write-Output "::error::签到脚本退出码 $code"
          exit $code
        }

    - name: 同步轮换后的令牌到 Secrets
      if: always()
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        $content = Get-Content -Raw checkin_output.txt -ErrorAction SilentlyContinue
        # 当前无启用站点，保留回写结构以便后续扩充（在数组中补充对应环境变量名即可）
        foreach ($envName in @()) {
          $pattern = '##' + $envName + '_B64##(\S+)'
          if ($content -match $pattern) {
            $b64 = $Matches[1]
            $json = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($b64))
            gh secret set $envName --repo "$env:GITHUB_REPOSITORY" --body $json
            Write-Output "$envName secret updated (refresh token rotated)"
          } else {
            Write-Output "No rotation payload for $envName, skip secret update"
          }
        }

    - name: 签到失败告警
      if: failure()
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $server = $env:GITHUB_SERVER_URL
        $repo = $env:GITHUB_REPOSITORY
        $runUrl = "$server/$repo/actions/runs/$env:GITHUB_RUN_ID"

        $log = Get-Content -Raw checkin_output.txt -ErrorAction SilentlyContinue
        if (-not $log) { $log = '(无输出或脚本未产生日志)' }
        # 脱敏：JWT / base64 长串 / 常见 token 字段
        $log = $log -replace 'eyJ[\w\-]{8,}\.[\w\-]{8,}\.[\w\-]{8,}', '***JWT***'
        $log = $log -replace '(?i)("?(?:token|authorization|password|cookie)"?\s*[:=]\s*"?)[^\s",}]+', '$1***'
        $log = $log -replace '[A-Za-z0-9\+/]{40,}={0,2}', '***'
        if ($log.Length -gt 50000) { $log = $log.Substring($log.Length - 50000) }
        $log = $log -replace '```', "'''"

        $body = (@(
          '### 自动签到失败',
          '',
          '| 项目 | 值 |',
          '| --- | --- |',
          "| 运行 | $runUrl |",
          "| 分支 | $env:GITHUB_REF_NAME |",
          "| 触发方式 | $env:GITHUB_EVENT_NAME |",
          "| 时间(UTC) | $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss') |",
          '',
          '<details><summary>签到日志（尾部，已脱敏）</summary>',
          '',
          '<pre>',
          $log,
          '</pre>',
          '',
          '</details>'
        ) -join "`n")

        # 确保标签存在（幂等）
        gh label create checkin-failure --repo $repo --color B60205 --description "自动签到失败告警" --force 2>$null | Out-Null

        $existing = gh issue list --repo $repo --label checkin-failure --state open --limit 1 --json number --jq '.[0].number'
        if ($existing) {
          gh issue comment $existing --repo $repo --body $body
          Write-Output "已在 Issue #$existing 追加失败记录（复用未关闭告警）"
        } else {
          $title = "签到失败: " + (Get-Date -Format 'yyyy-MM-dd HH:mm') + " (UTC)"
          gh issue create --repo $repo --title $title --label checkin-failure --body $body
          Write-Output "已创建失败告警 Issue"
        }

    - name: 执行结果
      if: always()
      run: |
        echo "签到任务执行完成"
        echo "时间: $(Get-Date)"

